name: Docs checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Documentation gate (structure + links + geometry)
        run: python3 tools/doc_check.py
      - name: Doc-gate self-tests
        run: python3 -m unittest tools.test_doc_check -v
      - name: Agent recipes (live public surface)
        run: python3 tools/recipes_run.py
      - name: Agent recipes selftest (negative controls)
        run: python3 tools/recipes_run.py --selftest
      - name: NORTHSTAR four-turn acceptance (live public surface)
        run: python3 tools/northstar_eval.py
